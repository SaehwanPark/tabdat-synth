[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabdat-synth"
version = "0.2.0"
description = "Spec-driven tabular data synthesis with reusable fitted bundles."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "synthetic-data",
    "tabular-data",
    "data-generation",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "lightgbm>=4.6.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "polars>=1.40.1",
    "PyYAML>=6.0.2",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
env = [
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/SaehwanPark/tabdat-synth"
Repository = "https://github.com/SaehwanPark/tabdat-synth"
Documentation = "https://github.com/SaehwanPark/tabdat-synth/blob/main/docs/user-manual.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.0",
    "twine>=6.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "local_data: tests that require private or local data paths and explicit opt-in",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
